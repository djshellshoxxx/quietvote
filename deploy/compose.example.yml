services:
  quietvote:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    init: true
    restart: unless-stopped
    read_only: true
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./server.json:/etc/quietvote/server.json:ro
      - ./data:/var/lib/quietvote
    tmpfs:
      - /tmp:size=64m,mode=1777
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
