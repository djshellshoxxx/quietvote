name: web pseudo-locale visual checks

on:
  pull_request:
    paths:
      - 'packages/web/src/**'
      - 'packages/web/static/**'
      - 'packages/web/e2e/pseudo-locale-visual-ci.mjs'
      - '.github/workflows/pseudo-locale-visual.yml'
  push:
    branches: [main]
    paths:
      - 'packages/web/src/**'
      - 'packages/web/static/**'
      - 'packages/web/e2e/pseudo-locale-visual-ci.mjs'
      - '.github/workflows/pseudo-locale-visual.yml'

permissions: {}

concurrency:
  group: pseudo-locale-visual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pseudo-locale-visual:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Install temporary pinned Playwright runner
        run: npm install --prefix "$RUNNER_TEMP/qv-playwright" --no-save --no-package-lock playwright@1.62.0
      - name: Install Chromium for the pinned Playwright runner
        run: "$RUNNER_TEMP/qv-playwright/node_modules/.bin/playwright" install --with-deps chromium
      - name: Check pseudo locales, responsive layout, and saved language
        run: node packages/web/e2e/pseudo-locale-visual-ci.mjs
        env:
          QV_PLAYWRIGHT_MODULE_ROOT: ${{ runner.temp }}/qv-playwright/node_modules
