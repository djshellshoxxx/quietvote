name: ci

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

# Deny everything by default; each job grants only what it needs.
permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck-test:
    name: typecheck + test (node ${{ matrix.node }})
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      # TODO: pin to SHA (docs/30 §9 requires full commit SHA pinning)
      - uses: actions/checkout@v4 # pin to SHA
        with:
          persist-credentials: false
      # TODO: pin to SHA (docs/30 §9 requires full commit SHA pinning)
      - uses: actions/setup-node@v4 # pin to SHA
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
