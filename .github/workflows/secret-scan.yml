name: secret scan

# Independent of ci.yml's documentation exclusions: every PR includes this gate.
on:
  pull_request:
  push:
    branches:
      - main
  merge_group:
  schedule:
    - cron: '43 9 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: secret-scan-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: repository secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Test secret scanner boundaries and workflow coverage
        run: node --test scripts/secret-scan.test.mjs
      - name: Scan tracked and nonignored untracked text
        run: node scripts/secret-scan.mjs --json
      - name: Scan complete available history nightly and on manual qualification
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: node scripts/secret-scan.mjs --history --json
